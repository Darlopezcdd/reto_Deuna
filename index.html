<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deuna — Simulador de Apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',-apple-system,sans-serif;background:#0e0b1a;color:#fff;min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background:radial-gradient(ellipse 80% 55% at 15% 0%,rgba(91,45,142,.35) 0%,transparent 60%),
      radial-gradient(ellipse 55% 45% at 85% 100%,rgba(91,45,142,.2) 0%,transparent 55%)}

    .site-header{text-align:center;padding:24px 20px 0;position:relative;z-index:1}
    .logo-wrap{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px}
    .logo-d{font-size:1.6rem;font-weight:900;color:#7B3FBD}
    .logo-text{font-size:1.1rem;font-weight:700;letter-spacing:-.02em}
    .logo-text em{font-style:normal;color:#9090a8;font-weight:400}
    .header-subtitle{font-size:.72rem;color:#9090a8}

    .stage{display:flex;align-items:flex-start;justify-content:center;gap:20px;padding:20px;position:relative;z-index:1;flex-wrap:wrap}

    .phone-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
    .phone-label{text-align:center}
    .phone-label h2{font-size:1rem;font-weight:800;margin-top:4px}
    .phone-label p{font-size:.65rem;color:#9090a8}

    .badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:.62rem;font-weight:700}
    .badge-user{background:rgba(91,45,142,.2);color:#c084fc;border:1px solid rgba(91,45,142,.3)}
    .badge-vendor{background:rgba(91,45,142,.2);color:#c084fc;border:1px solid rgba(91,45,142,.3)}

    .phone-frame{
      width:375px;height:720px;
      border-radius:40px;
      border:3px solid rgba(255,255,255,.1);
      background:#fff;
      overflow:hidden;
      box-shadow:0 25px 80px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.05);
      position:relative;
    }
    .phone-frame iframe{
      width:100%;height:100%;border:none;border-radius:37px;
    }

    .connector{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:120px}
    .connector-line{width:2px;height:60px;background:linear-gradient(180deg,transparent,rgba(123,63,189,.4),transparent)}
    .connector-badge{
      background:rgba(91,45,142,.15);border:1px solid rgba(123,63,189,.3);
      border-radius:16px;padding:10px 14px;text-align:center;
    }
    .connector-badge span{font-size:1.5rem;display:block}
    .connector-badge small{font-size:.58rem;color:#9090a8;font-weight:500}

    @media(max-width:900px){
      .stage{flex-direction:column;align-items:center}
      .connector{flex-direction:row;padding:0;gap:12px}
      .connector-line{width:60px;height:2px;background:linear-gradient(90deg,transparent,rgba(123,63,189,.4),transparent)}
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo-wrap">
      <span class="logo-d">d!</span>
      <span class="logo-text">deuna <em>simulador</em></span>
    </div>
    <p class="header-subtitle">Vista previa interactiva · Usuario & Vendedor · Firebase en tiempo real</p>
  </header>

  <main class="stage">
    <!-- PHONE: USUARIO -->
    <section class="phone-wrap">
      <div class="phone-label">
        <span class="badge badge-user">👤 App Usuario</span>
        <h2>Deuna</h2>
        <p>Perspectiva del cliente</p>
      </div>
      <div class="phone-frame">
        <iframe src="AndroidAppDeunaUsers/Assets/index.html" title="Deuna Usuarios"></iframe>
      </div>
    </section>

    <!-- CONNECTOR -->
    <div class="connector">
      <div class="connector-line"></div>
      <div class="connector-badge">
        <span>🔥</span>
        <small>Firebase<br/>Tiempo Real</small>
      </div>
      <div class="connector-line"></div>
    </div>

    <!-- PHONE: VENDEDOR -->
    <section class="phone-wrap">
      <div class="phone-label">
        <span class="badge badge-vendor">🏪 App Vendedor</span>
        <h2>Deuna Negocios</h2>
        <p>Perspectiva del comercio</p>
      </div>
      <div class="phone-frame">
        <iframe src="AndroidAppDeunaNegocios/Assets/index.html" title="Deuna Negocios"></iframe>
      </div>
    </section>
  </main>
</body>
</html>
